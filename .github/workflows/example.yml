name: Action smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the checked-out composite action
        uses: ./
        with:
          root: examples/demo/miniprogram
          config: examples/demo/miniapp-packguard.config.json
          report-dir: .packguard-reports
      - name: Validate generated reports
        shell: bash
        run: |
          test -s .packguard-reports/report.json
          test -s .packguard-reports/report.md
          test -s .packguard-reports/report.sarif

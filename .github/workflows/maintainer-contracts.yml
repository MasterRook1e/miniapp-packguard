name: Maintainer contracts

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-evidence:
    name: Review evidence contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate contracts
        uses: MasterRook1e/maintainer-contracts@3d73d62e75d922d9f5022f886b5b1092419412fa
        with:
          config: maintainer-contracts.config.json
          report-dir: .maintainer-contracts
          github-annotations: "true"

      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintainer-contracts-report
          path: .maintainer-contracts
          if-no-files-found: warn
          retention-days: 14

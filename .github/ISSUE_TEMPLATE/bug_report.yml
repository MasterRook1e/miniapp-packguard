name: Bug report
description: Report a reproducible incorrect finding or runtime failure
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not attach proprietary source, credentials, customer data, or unpublished assets.
  - type: input
    id: version
    attributes:
      label: PackGuard version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js, operating system, and shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal neutral reproduction
      description: Include the command, redacted configuration, and a small synthetic file tree.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and report excerpt
    validations:
      required: true
